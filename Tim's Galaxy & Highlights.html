<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>กาแล็คซี่ของทิม</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Prompt', sans-serif;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- Intro Screen --- */
        #intro-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #240018 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            transition: opacity 1.5s ease-in-out, visibility 1.5s;
        }

        .tim-aura-text {
            font-size: 2.2rem;
            color: #fff;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 600;
            animation: textAura 2s infinite alternate;
            padding: 0 20px;
        }

        .tim-aura-sub {
            font-size: 1.1rem;
            color: #ffb3d9;
            margin-bottom: 50px;
            text-shadow: 0 0 10px #ff007f;
            animation: pulseText 2s infinite;
        }

        @keyframes textAura {
            0% { text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff69b4; }
            100% { text-shadow: 0 0 20px #ffb3d9, 0 0 40px #ff69b4, 0 0 60px #ff1493; }
        }

        .gift-box {
            font-size: 80px;
            cursor: pointer;
            animation: bounce 2s infinite, glowGift 2s infinite alternate;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            z-index: 2;
        }

        @keyframes glowGift {
            from { filter: drop-shadow(0 0 15px #ff007f); }
            to { filter: drop-shadow(0 0 30px #ffb3d9) drop-shadow(0 0 40px #ff69b4); }
        }

        /* --- Password Box --- */
        #password-container {
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(20, 0, 10, 0.7);
            padding: 40px 30px;
            border-radius: 25px;
            border: 1px solid rgba(255, 105, 180, 0.4);
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.3);
            transform: scale(0.8);
            opacity: 0;
            transition: all 0.4s ease;
            position: absolute;
            z-index: 3;
        }

        #password-container.show {
            display: flex;
            transform: scale(1);
            opacity: 1;
        }

        #password-container.shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            border-color: #ff3333;
        }

        .pass-label {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff69b4;
        }

        #pass-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #ffb3d9;
            color: #fff;
            font-size: 1.8rem;
            text-align: center;
            outline: none;
            font-family: 'Prompt', sans-serif;
            width: 80%;
            margin-bottom: 25px;
            padding: 5px;
            transition: border-color 0.3s;
        }

        #pass-input:focus { border-bottom: 2px solid #ff1493; }
        #pass-input::placeholder { color: rgba(255, 255, 255, 0.3); font-size: 1rem; }

        .btn-unlock {
            background: linear-gradient(45deg, #ff007f, #ff69b4);
            border: none;
            padding: 12px 40px;
            border-radius: 30px;
            color: white;
            font-family: 'Prompt', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 15px #ff1493;
        }

        #error-msg {
            color: #ff6666;
            font-size: 0.9rem;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* --- Main UI (Title & Highlight Button) --- */
        #main-title {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 2.5rem;
            font-style: italic;
            font-weight: 300;
            text-shadow: 0 0 15px #ff007f;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease-in-out 1s;
        }

        /* ปุ่มดูไฮไลท์ */
        #btn-highlight-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 15;
            opacity: 0;
            visibility: hidden;
            transition: opacity 2s ease-in-out 2s;
        }

        .btn-highlight {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid #ffb3d9;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            font-family: 'Prompt', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: pulseBtn 2s infinite alternate;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(255,0,127,0.5); }
            100% { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,0,127,0.8); }
        }

        /* --- Highlight Modal (แกลเลอรี) --- */
        #highlight-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease;
        }

        #highlight-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-header {
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            color: #ffb3d9;
            font-size: 1.5rem;
            text-shadow: 0 0 10px #ff007f;
            margin: 0;
        }

        .btn-close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            padding: 0;
        }

        .gallery-container {
            width: 100%;
            overflow-x: auto;
            display: flex;
            gap: 20px;
            padding: 20px 5%;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            box-sizing: border-box;
        }

        /* ซ่อน Scrollbar */
        .gallery-container::-webkit-scrollbar { display: none; }

        .polaroid {
            flex: 0 0 auto;
            width: 250px;
            background: white;
            padding: 10px 10px 20px 10px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            scroll-snap-align: center;
            transform: rotate(-2deg);
        }

        .polaroid:nth-child(even) {
            transform: rotate(3deg);
        }

        .polaroid img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 5px;
            background-color: #eee;
        }

        .polaroid-caption {
            color: #333;
            text-align: center;
            margin-top: 10px;
            font-size: 1rem;
            font-weight: 600;
        }

        /* --- Popup Message --- */
        #popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(20, 0, 10, 0.9);
            border: 1px solid #ff4da6;
            box-shadow: 0 0 25px #ff007f;
            padding: 30px;
            border-radius: 20px;
            color: white;
            text-align: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            min-width: 280px;
            max-width: 85%;
        }

        #popup.active {
            opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1);
        }

        #popup-text {
            font-size: 1.3rem; margin-bottom: 20px; text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        #close-popup {
            background: linear-gradient(45deg, #ff007f, #ff4da6); border: none;
            color: white; padding: 10px 30px; border-radius: 25px; font-family: 'Prompt', sans-serif;
            font-size: 1.1rem; cursor: pointer;
        }

        /* Animations */
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes pulseText { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0) scale(1); }
            20%, 80% { transform: translate3d(4px, 0, 0) scale(1); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0) scale(1); }
            40%, 60% { transform: translate3d(8px, 0, 0) scale(1); }
        }
    </style>
</head>
<body>

    <!-- 1. Intro Screen with Password -->
    <div id="intro-screen">
        <div class="tim-aura-text" id="intro-title">แด่ ทิม...<br>คนที่น่ารักที่สุดในกาแล็คซี่นี้ ✨</div>
        <div class="tim-aura-sub" id="intro-sub">แตะที่กล่องของขวัญเพื่อเปิดความลับ</div>
        
        <div class="gift-box" id="start-btn">🎁</div>

        <div id="password-container">
            <div class="pass-label">กุญแจคือชื่อเจ้าของหัวใจ 💖</div>
            <input type="text" id="pass-input" placeholder="พิมพ์ชื่อตรงนี้..." autocomplete="off">
            <button class="btn-unlock" id="unlock-btn">✨ ปลดล็อก</button>
            <div id="error-msg">เอ๊ะ! รหัสผ่านยังไม่ใช่นะ ลองคิดดูดีๆ 🤔</div>
        </div>
    </div>

    <!-- 2. Main Title -->
    <div id="main-title">For Tim ❤️</div>

    <!-- 3. Highlight Button -->
    <div id="btn-highlight-container">
        <button class="btn-highlight" id="open-highlight">📸 ดูไฮไลท์ของเรา</button>
    </div>

    <!-- 4. Highlight Modal (แกลเลอรีรูปภาพ) -->
    <div id="highlight-modal">
        <div class="modal-header">
            <h2 class="modal-title">ความทรงจำของเรา 💖</h2>
            <button class="btn-close-modal" id="close-highlight">&times;</button>
        </div>
        <div class="gallery-container">
            <!-- รูปที่ 1 -->
            <div class="polaroid">
                <!-- เปลี่ยน URL ตรง src="..." เป็นลิงก์รูปของคุณได้เลย -->
                <img src="https://images.unsplash.com/photo-1518192182181-56214069b828?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Memory 1">
                <div class="polaroid-caption">รอยยิ้มของทิม 😊</div>
            </div>
            <!-- รูปที่ 2 -->
            <div class="polaroid">
                <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Memory 2">
                <div class="polaroid-caption">วันดีๆ ของเรา 🌟</div>
            </div>
            <!-- รูปที่ 3 -->
            <div class="polaroid">
                <img src="https://images.unsplash.com/photo-1494774157365-9e04c6720e47?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Memory 3">
                <div class="polaroid-caption">ดอกไม้ให้คนเก่ง 🌸</div>
            </div>
            <!-- รูปที่ 4 -->
            <div class="polaroid">
                <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Memory 4">
                <div class="polaroid-caption">รักนะ จุ๊บๆ 😘</div>
            </div>
        </div>
    </div>

    <!-- 5. 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- 6. Popup Message for Stars -->
    <div id="popup">
        <div id="popup-text">ข้อความจะปรากฏที่นี่</div>
        <button id="close-popup">ปิด</button>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- ระบบรหัสผ่าน ---
        const startBtn = document.getElementById('start-btn');
        const passContainer = document.getElementById('password-container');
        const passInput = document.getElementById('pass-input');
        const unlockBtn = document.getElementById('unlock-btn');
        
        let isStarted = false;
        let targetCameraZ = 60; 

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            document.getElementById('intro-title').style.display = 'none';
            document.getElementById('intro-sub').style.display = 'none';
            
            passContainer.style.display = 'flex';
            setTimeout(() => {
                passContainer.classList.add('show');
                passInput.focus();
            }, 50);
        });

        function checkPassword() {
            const val = passInput.value.trim();
            if (val === 'ทิม' || val.toLowerCase() === 'tim') {
                document.getElementById('intro-screen').style.opacity = '0';
                setTimeout(() => { document.getElementById('intro-screen').style.display = 'none'; }, 1500);

                document.getElementById('main-title').style.opacity = '1';
                
                // โชว์ปุ่มไฮไลท์
                const highlightBtn = document.getElementById('btn-highlight-container');
                highlightBtn.style.visibility = 'visible';
                highlightBtn.style.opacity = '1';

                isStarted = true;
            } else {
                document.getElementById('error-msg').style.opacity = '1';
                passContainer.classList.remove('shake');
                void passContainer.offsetWidth; 
                passContainer.classList.add('shake');
                passInput.value = ''; 
                passInput.focus();
            }
        }

        unlockBtn.addEventListener('click', checkPassword);
        passInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkPassword(); });

        // --- ระบบแกลเลอรีรูปภาพ ---
        const btnOpenHighlight = document.getElementById('open-highlight');
        const btnCloseHighlight = document.getElementById('close-highlight');
        const highlightModal = document.getElementById('highlight-modal');

        btnOpenHighlight.addEventListener('click', () => {
            highlightModal.classList.add('active');
        });

        btnCloseHighlight.addEventListener('click', () => {
            highlightModal.classList.remove('active');
        });

        // --- ข้อความต่างๆ บนดวงดาว ---
        const messages = [
            "ขอโทษที่ทำให้ทิมเสียใจบ่อยนะ 🥺",
            "ขอโทษที่ไม่เข้าใจในบางครั้ง 😭",
            "เรานอยง่ายซะด้วยสิ แหะๆ 🥹",
            "รักทิมที่สุดเลยนะ 💖",
            "อยู่ด้วยกันไปนานๆ โลดดดดด 🥰",
            "จักรวาลนี้สร้างมาเพื่อทิมคนเดียว 🌌",
            "อย่าร้องบ่อยสิ เดี๋ยวไม่ฉวย 🌟",
            "โรคร้ายไรทิมต้องผ่านให้ได้นะทิมโหดยุแล้ว 🧸",
            "อยากให้ทิมเปิดใจกับเราสักวันนึง 🌸",
            "อยากกอดตัวจริงมากๆๆๆ 😘"
        ];
        const icons = ["🎁", "💌", "🧸", "🌸", "💖", "✨"];

        // --- Setup Three.js (ปรับลดความแลค) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 150); 

        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true }); // ปิด antialias ลดแลค
        renderer.setSize(window.innerWidth, window.innerHeight);
        // จำกัด Pixel Ratio ลดภาระ GPU มือถือ
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.minDistance = 20;
        controls.maxDistance = 100;
        controls.autoRotate = true; 
        controls.autoRotateSpeed = 0.5; 

        const galaxyGroup = new THREE.Group();
        scene.add(galaxyGroup);

        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 16; // ลดขนาด texture ลง
            canvas.height = 16;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(8, 8, 0, 8, 8, 8);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,100,180,1)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 16, 16);
            return new THREE.CanvasTexture(canvas);
        }
        const particleTexture = createParticleTexture();

        // 1. หัวใจ (ลดจำนวนลงเหลือ 1500)
        const heartGeometry = new THREE.BufferGeometry();
        const heartCount = 1500;
        const heartPositions = new Float32Array(heartCount * 3);
        const heartColors = new Float32Array(heartCount * 3);
        const colorPink = new THREE.Color('#ff007f');

        for(let i = 0; i < heartCount; i++) {
            const t = Math.random() * Math.PI * 2;
            const spread = THREE.MathUtils.randFloat(0, 1.5);
            let x = 16 * Math.pow(Math.sin(t), 3) * 0.8;
            let y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 0.8;
            let z = (Math.random() - 0.5) * 5; 
            
            heartPositions[i*3] = x + (Math.random() - 0.5) * spread;
            heartPositions[i*3+1] = y + (Math.random() - 0.5) * spread;
            heartPositions[i*3+2] = z + (Math.random() - 0.5) * spread;

            heartColors[i*3] = colorPink.r + Math.random()*0.2;
            heartColors[i*3+1] = colorPink.g + Math.random()*0.2;
            heartColors[i*3+2] = colorPink.b + Math.random()*0.2;
        }
        heartGeometry.setAttribute('position', new THREE.BufferAttribute(heartPositions, 3));
        heartGeometry.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));
        const heartMaterial = new THREE.PointsMaterial({ size: 1, vertexColors: true, map: particleTexture, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
        const heartParticles = new THREE.Points(heartGeometry, heartMaterial);
        galaxyGroup.add(heartParticles);

        // 2. แขนกาแล็คซี่ (ลดจำนวนลงเหลือ 8000)
        const armGeometry = new THREE.BufferGeometry();
        const armCount = 8000;
        const armPositions = new Float32Array(armCount * 3);
        const armColors = new Float32Array(armCount * 3);
        const colorPurple = new THREE.Color('#8e2de2');

        for(let i = 0; i < armCount; i++) {
            const radius = Math.random() * 55 + 5;
            const branchAngle = (i % 4) / 4 * Math.PI * 2;
            const spinAngle = radius * 0.12; 
            
            const randomX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 10;
            const randomY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 4;
            const randomZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 10;

            armPositions[i*3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
            armPositions[i*3+1] = randomY; 
            armPositions[i*3+2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

            armColors[i*3] = colorPurple.r + Math.random()*0.3;
            armColors[i*3+1] = colorPurple.g + Math.random()*0.2;
            armColors[i*3+2] = colorPurple.b + Math.random()*0.3;
        }
        armGeometry.setAttribute('position', new THREE.BufferAttribute(armPositions, 3));
        armGeometry.setAttribute('color', new THREE.BufferAttribute(armColors, 3));
        const armMaterial = new THREE.PointsMaterial({ size: 0.6, vertexColors: true, map: particleTexture, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
        const armParticles = new THREE.Points(armGeometry, armMaterial);
        armParticles.rotation.x = 0.2;
        galaxyGroup.add(armParticles);

        // 3. ป้ายข้อความ/ไอคอน
        const interactiveNodes = [];
        messages.forEach((msg, index) => {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.font = '40px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = '#ff69b4'; ctx.shadowBlur = 10;
            ctx.fillText(icons[Math.floor(Math.random() * icons.length)], 32, 32);
            
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
            const angle = Math.random() * Math.PI * 2;
            const radius = THREE.MathUtils.randFloat(18, 45);
            sprite.position.set(Math.cos(angle) * radius, THREE.MathUtils.randFloat(-10, 10), Math.sin(angle) * radius);
            sprite.scale.set(4, 4, 1);
            sprite.userData = { message: msg };
            galaxyGroup.add(sprite);
            interactiveNodes.push(sprite);
        });

        // --- Interaction ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const popup = document.getElementById('popup');
        
        function onInteract(event) {
            if (!isStarted || popup.classList.contains('active') || highlightModal.classList.contains('active')) return;
            
            let clientX = event.changedTouches ? event.changedTouches[0].clientX : event.clientX;
            let clientY = event.changedTouches ? event.changedTouches[0].clientY : event.clientY;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(interactiveNodes);
            if (intersects.length > 0) {
                document.getElementById('popup-text').innerHTML = intersects[0].object.userData.message;
                popup.classList.add('active');
            }
        }
        window.addEventListener('click', onInteract);
        window.addEventListener('touchstart', onInteract, {passive: false});
        document.getElementById('close-popup').addEventListener('click', () => popup.classList.remove('active'));

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            
            // ให้กราฟิกขยับก็ต่อเมื่อปลดล็อกแล้ว (ช่วยลดแลคตอนหน้าแรก)
            if (isStarted) {
                const elapsedTime = clock.getElapsedTime();
                heartParticles.rotation.y = elapsedTime * 0.25;
                controls.update();
                if (camera.position.z > targetCameraZ) camera.position.z -= (camera.position.z - targetCameraZ) * 0.05;
                renderer.render(scene, camera);
            }
        }
        animate();
    </script>
</body>
</html>
